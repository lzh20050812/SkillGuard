[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skillguard"
version = "0.1.0"
description = "Pre-install security and quality auditing for AI Agent Skills."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "PyYAML>=6.0", "python-dotenv>=1.0", "openai>=1.30"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
skillguard = "skillguard.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

